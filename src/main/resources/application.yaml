spring:
  application:
    name: bot

  # Training Configuration - NEW
training:
  data:
    directory: src/main/resources/data/training
  auto:
    generate: false  # Auto-generate training data from backtests
  batch:
    size: 32
  epochs: 50
  validation:
    split: 0.2
# ML Configuration

# Python Configuration
python:
  executable: python3
  ml:
    script:
      path: src/main/python/ml_predictor.py
    timeout: 10

# ML Configuration
ml:
  enabled: true
  weight: 0.7
  confidence:
    threshold: 0.6
  prediction:
    timeout: 30
    cache_duration: 900

# BACKTEST Configuration - Updated for resources directory
backtest:
  # Data Configuration - Use resources directory
  data:
    feather:
      directory: src/main/resources/data/feather

  # Python Configuration
  python:
    ml:
      script:
        path: src/main/python/ml_predictor.py
      models:
        path: src/main/resources/data/models  # Models in resources

  # Startup Configuration
  run:
    on:
      startup: false  # Set to true for testing

  directional:
    min:
      confidence: 0.65
      score: 5.0
    hold:
      exit:
        confidence: 0.8
    risk:
      stop:
        loss:
          percent: 3.0
      take:
        profit:
          percent: 6.0
      max:
        holding:
          hours: 120

  # Trading Parameters
  initial:
    balance: 10000.0

  fee:
    rate: 0.0004

  position:
    size:
      percent: 0.1  # 10% of balance per trade

  # Risk Management
  risk:
    stop:
      loss:
        percent: 3.0  # Same as trading.stopLimit but positive
    take:
      profit:
        percent: 6.0  # Same as trading.winLimit
    max:
      holding:
        hours: 168  # 7 days max hold

  # Analysis Configuration
  analysis:
    enable:
      rule:
        analysis: true
      multi:
        symbol:
          analysis: true
      optimization: false

  # Training Configuration - NEW
  training:
    data:
      directory: src/main/resources/data/training
    auto:
      generate: false  # Auto-generate training data from backtests
    batch:
      size: 32
    epochs: 50
    validation:
      split: 0.2

  # Performance Configuration
  performance:
    benchmark:
      symbol: BTC_USDT  # For comparison
    parallel:
      processing: true
    cache:
      results: true

