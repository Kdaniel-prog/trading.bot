# Logging Configuration
logging:
  level:
    kd.trading.bot.service.backtest: INFO
    kd.trading.bot.runner: INFO
    root: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  log_predictions: true
  log_feature_importance: true
  store_prediction_history: true
  track_live_performance: true
  compare_to_baseline: true

# Server Configuration
server:
  port: 8080


# ML Training Configuration for Trading Bot
# This configuration addresses the key issues identified in your model


# Outcome classification strategy
outcomes:
  # Improved outcome mapping based on PnL and time efficiency
  STRONG_WIN:
    pnl_min: 2.0
    max_hours: 48
    description: "Quick profitable trades"

  WIN:
    pnl_min: 0.5
    pnl_max: 2.0
    description: "Any profitable trade"

  NEUTRAL:
    pnl_min: -0.5
    pnl_max: 0.5
    max_hours: 24
    description: "Break-even quick trades"

  SMALL_LOSS:
    pnl_min: -2.0
    pnl_max: -0.5
    description: "Minor losses"

  LOSS:
    pnl_min: -5.0
    pnl_max: -2.0
    description: "Manageable losses"

  STRONG_LOSS:
    pnl_max: -5.0
    description: "Major losses"

# Data collection improvements
backtest_improvements:
  # Remove look-ahead bias
  strict_temporal_ordering: true
  execution_delay_candles: 1
  slippage_percent: 0.05

  # Better training data collection
  collect_negative_samples: true  # Include NO_TRADE samples
  sample_rate: 0.1  # Sample 10% of non-trading periods

  # Risk management during backtesting
  stop_loss_percent: 3.0
  take_profit_percent: 6.0
  max_holding_hours: 240

  # Signal filtering
  min_confidence: 0.65
  min_score: 5.0

# Model evaluation and monitoring
evaluation:
  # Metrics to track
  primary_metrics:
    - accuracy
    - precision_weighted
    - recall_weighted
    - f1_weighted

  trading_specific_metrics:
    - win_rate_prediction_accuracy
    - false_positive_rate
    - risk_adjusted_returns

  # Model validation
  validation_strategy: "time_series_split"  # Respect temporal order
  test_set_months: 2  # Use last 2 months as test set

  # Performance monitoring
  alert_thresholds:
    accuracy_drop: 0.05  # Alert if accuracy drops by 5%
    false_positive_spike: 0.1  # Alert if false positives increase

# Production deployment settings
deployment:
  model_versioning: true
  a_b_testing: true
  fallback_strategy: "conservative"  # Fall back to simpler rules if ML fails

  # Risk controls
  max_daily_trades: 10
  max_position_size: 0.05  # 5% of portfolio max

  # Model refresh
  retrain_frequency_days: 30
  min_new_samples_for_retrain: 100

# Logging and monitoring

# File paths
paths:
  training_data: "src/main/resources/data/training"
  models: "src/main/resources/data/models"
  logs: "src/main/resources/data/logs"
  backtest_results: "src/main/resources/data/backtest"