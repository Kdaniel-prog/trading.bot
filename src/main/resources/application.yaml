spring:
  application:
    name: bot

  # Training Configuration - NEW
training:
  data:
    directory: src/main/resources/data/training
    min_samples_per_outcome: 50
    balance_strategy: "oversample_minority"
    synthetic_samples_ratio: 0.25
    exclude_outcomes: [ "HOLDING"]
    quality_filters:
      min_candles_lookback: 50  # Minimum historical data required
      max_missing_indicators: 3  # Maximum missing technical indicators allowed
      min_pnl_range: -10.0  # Minimum PnL for inclusion (filter extreme outliers)
      max_pnl_range: 20.0   # Maximum PnL for inclusion
    features:
    technical_indicators:
      - rsi
      - ema20
      - ema50
      - volumeRatio
      - macdLine
      - atr
      - currentPrice

    engineered_features:
      - rsi_momentum
      - price_volatility
      - trend_strength
      - risk_reward_ratio
      - market_state_composite

  categorical_features:
    - timeframe
    - symbol_category  # e.g., BTC_pairs, ETH_pairs, etc.
  auto:
    generate: false  # Auto-generate training data from backtests
  batch:
    size: 32
  epochs: 50
  validation:
    split: 0.2
  model:
    architecture: "improved_neural_network"
    layers:
      - type: "dense"
        units: 256
        activation: "swish"
        dropout: 0.3
        batch_norm: true

      - type: "dense"
        units: 128
        activation: "swish"
        dropout: 0.4
        batch_norm: true

      - type: "attention"
        units: 64

      - type: "dense"
        units: 64
        activation: "swish"
        dropout: 0.3

      - type: "output"
        activation: "softmax"
        regularization: 0.01

        # Training parameters
        optimizer:
          type: "AdamW"
          learning_rate: 0.001
          weight_decay: 0.0001

        loss_function: "sparse_categorical_crossentropy"
        metrics: ["accuracy", "sparse_top_k_categorical_accuracy"]
  training_process:
    epochs: 100
    batch_size: 32
    validation_split: 0.2
    cross_validation_folds: 3

  # Callbacks
  callbacks:
    early_stopping:
      monitor: "val_accuracy"
      patience: 15
      restore_best_weights: true

    reduce_lr:
      monitor: "val_loss"
      factor: 0.5
      patience: 8
      min_lr: 0.000001

  # Class balancing
  class_weight: "balanced"  # Automatically compute weights

  # Performance thresholds
  min_accuracy: 0.45  # Minimum acceptable accuracy to save model
  min_precision: 0.40  # Minimum precision for trading classes
# ML Configuration

# Python Configuration
python:
  executable: python3
  ml:
    script:
      path: src/main/python/ml_predictor.py
    timeout: 10

# ML Configuration
ml:
  enabled: true
  weight: 0.7
  confidence:
    threshold: 0.6
  prediction:
    timeout: 30
    cache_duration: 900

# BACKTEST Configuration - Updated for resources directory
backtest:
  # Data Configuration - Use resources directory
  data:
    feather:
      directory: src/main/resources/data/feather
  # Python Configuration
  python:
    ml:
      script:
        path: src/main/python/ml_predictor.py
      models:
        path: src/main/resources/data/models  # Models in resources

  # Startup Configuration
  run:
    on:
      startup: false  # Set to true for testing

  # Fixed Trading Configuration
  directional:
    min:
      confidence: 0.90  # Was 0.0 - no trades would ever be taken
      score: 8.0       # Was 0.0 - no trades would ever be taken

    # Long signal thresholds
    long:
      confidence: 0.90  # Was 0.0 - no trades would ever be taken
      score: 8.0      # Minimum score for LONG trades

    # Short signal thresholds
    short:
      confidence: 0.90  # Was 0.0 - no trades would ever be taken
      score: 8.0   # Minimum score for SHORT trades

    hold:
      exit:
        confidence: 0.3  # Was 0.0 - positions would never exit
        score: 0.3       # Exit when confidence drops below this
    min.confidence: 0.80
    min.score: 8.0

  risk:
    stop.loss.percent: 3.0
    take.profit.percent: 6.0
    max.holding.hours: 240
    hold.exit.confidence: 0.75
    max.volatility.percent: 12.0

  # Position sizing
  position:
    base_size: 1000.0     # Base position size in USDT
    max_positions: 3      # Maximum concurrent positions
    min_trade_size: 50.0
    size:
      percent: 0.1  # 10% of balance per trade  # Minimum trade size

  # Data requirements

  # Trading Parameters
  initial:
    balance: 10000.0
  fee:
    rate: 0.0004

  # Analysis Configuration
  analysis:
    enable:
      rule:
        analysis: true
      multi:
        symbol:
          analysis: true
      optimization: false

  # Training Configuration - NEW
  training:
    data:
      directory: src/main/resources/data/training
    auto:
      generate: false  # Auto-generate training data from backtests
    batch:
      size: 32
    epochs: 50
    validation:
      split: 0.2

  # Performance Configuration
  performance:
    benchmark:
      symbol: BTC_USDT  # For comparison
    parallel:
      processing: true
    cache:
      results: true

